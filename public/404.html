<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zain Iqbal — Flutter Developer</title>
    <script type="text/javascript">
      // GitHub Pages SPA fallback (https://github.com/rafgraph/spa-github-pages)
      // Pages serves this file for unknown paths; it re-encodes the requested
      // path into a query string and redirects to index.html, where the
      // companion script in index.html restores the real URL for the router.
      // pathSegmentsToKeep = 1 because the site lives under /iZainIqbal/.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
